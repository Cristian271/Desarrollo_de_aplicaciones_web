<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Encargos - Artik3D</title>
    <link rel="stylesheet" href="css/administradorTienda.css">
    <link rel="stylesheet" href="css/administradorEncargos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="js/administradorEncargos.js" defer></script>
</head>

<body>
    <aside class="panel-lateral">
        <a href="index.html">
            <img src="assets/images/LArtik3D.png" width="100" height="50" class="logo" alt="Logo Artik3D">
        </a>
        <h2>Panel <span class="decoracion">Admin</span></h2>
        <nav class="menu-admin">
            <a href="administradorComentarios.html">Comentarios</a>
            <a href="administradorTienda.html">Tienda</a>
            <a href="administradorProductosDestacados.html">Productos destacados</a>
            <a href="administradorEncargos.html" class="activo">Encargos</a>
        </nav>
        <button class="btn-cerrar-sesion" id="btn-cerrar-sesion">Cerrar panel</button>
    </aside>

    <main class="contenido-principal">
        <div class="cabecera-admin">
            <div>
                <h1 class="secciones">Gestión de encargos</h1>
                <p>Administra pedidos pendientes, modifica cantidades, descarga tickets PDF o finaliza entregas</p>
            </div>
        </div>

        <section id="lista-encargos" class="contenedor-encargos"></section>

    <!-- Panel lateral derecho desplegable con scroll para el ticket -->
    <aside id="panel-lateral-encargo" class="panel-detalle-encargo">
        <div class="panel-lateral-cabecera">
            <span class="etiqueta-panel">Detalle del Pedido</span>
            <button type="button" class="btn-cerrar-panel" onclick="cerrarPanelLateral()">✕ Cerrar</button>
        </div>
        <div id="detalle-encargo-contenido"></div>
    </aside>
