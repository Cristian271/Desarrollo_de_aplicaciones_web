<!DOCTYPE html>
<html lang="es">
<head>
    <meta 
    charset="UTF-8"
    name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>Validar Credencial - Artik3D</title>
    <link rel="stylesheet" href="css/validarCredencial.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="js/validarCredencial.js" defer></script>
</head>

<body>
    <main>
        <form id="formulario-login">
            <h2>Inicio de sesión</h2>
            <p>Ingresa tus credenciales para continuar</p>

            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Ingresa tu usuario" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>

            <div class="botones-formulario">
                <a href="index.html" class="btn-volver">Volver</a>
                <button type="submit" class="btn-ingresar" id="btn-ingresar">Ingresar</button>
            </div>
        </form>
    </main>
</body>
</html>
