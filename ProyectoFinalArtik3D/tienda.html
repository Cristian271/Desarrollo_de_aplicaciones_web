<!DOCTYPE html>
<html lang="es">
<head>
    <meta 
    charset="UTF-8"
    name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>Tienda - Artik3D</title>
    <link rel="stylesheet" href="css/tienda.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="js/tienda.js?v=2" defer></script>
    <script src="js/carrito.js" defer></script>
</head>

<body>
    <header>
        <nav>
            <a href="index.html"><img src="assets/images/LArtik3D.png" width="100" height="50" class="logo" alt="Logo Artik3D"></a>
            <div class="nav-logos">
                <div class="nav-links">
                    <a href="index.html">Inicio</a>
                    <a>Contacto</a>
                </div>
                <a href="#" class="btn-carrito-nav" title="Ver carrito">
                    <img src="assets/images/boton/carritoCompras.png" alt="Carrito de compras">
                </a>
            </div>
        </nav>
    </header>

    <main>
        <h1 class="secciones">Catalogo de productos</h1>
        <p>Todos nuestros modelos disponibles para impresión</p>

        <section class="barra-busqueda-tienda" aria-label="Buscador de productos">
            <form id="form-busqueda-tienda" class="buscador-tienda" role="search">
                <label for="input-buscar-producto" class="sr-only">Buscar producto por nombre</label>
                <div class="buscador-input-wrapper">
                    <img src="assets/images/lupa.png" class="icono-lupa" alt="" aria-hidden="true">
                    <input
                        type="search"
                        id="input-buscar-producto"
                        name="q"
                        maxlength="120"
                        autocomplete="off"
                        placeholder="Buscar producto por nombre..."
                        aria-label="Buscar producto por nombre">
                    <button
                        type="button"
                        id="btn-limpiar-busqueda"
                        class="btn-limpiar-busqueda"
                        title="Limpiar búsqueda"
                        aria-label="Limpiar búsqueda"
                        hidden>&times;</button>
                </div>
                <button type="submit" class="btn-buscar-tienda">Buscar</button>
            </form>
            <p id="estado-busqueda" class="estado-busqueda" aria-live="polite"></p>
        </section>

        <section class="contenedor-catalogo"></section>
    </main>

    <footer>
        <p>&copy; 2026 Artik3D</p>
    </footer>
</body>
</html>
